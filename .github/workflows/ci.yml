name: CI

# Required automated checks (see docs/governance/required-automated-checks.md).
# Generated code passes the same gates as hand-written code.

on:
  push:
    branches: [main, claude]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4 mypy==1.14.0 pip-audit==2.7.3
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: python -m pytest
      - name: Migrations round-trip (rollback proof)
        run: |
          rm -f setlist.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Dependency audit
        run: pip-audit -r requirements.txt || true  # advisory: report, do not hard-fail slice 1

  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: setlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.4
      - name: Apply canonical schema to test Postgres
        run: psql "postgresql://postgres:test@localhost:5432/setlist" -f ../docs/database/canonical_supabase_schema.sql
      - name: Tests (offline + loader against Postgres)
        env:
          # Un-skips tests/test_loader.py so the DB loader is exercised in CI.
          SCRAPER_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/setlist
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high || true  # advisory in slice 1
