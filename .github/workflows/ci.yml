name: CI

# Required automated checks (see docs/governance/required-automated-checks.md).
# Generated code passes the same gates as hand-written code.

on:
  push:
    branches: [main, claude]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4 mypy==1.14.0 pip-audit==2.7.3
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Tests
        run: python -m pytest
      - name: Migrations round-trip (rollback proof)
        run: |
          rm -f setlist.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Dependency audit
        run: pip-audit -r requirements.txt || true  # advisory: report, do not hard-fail slice 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high || true  # advisory in slice 1
