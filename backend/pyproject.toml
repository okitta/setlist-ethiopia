[project]
name = "setlist-ethiopia-backend"
version = "0.1.0"
description = "Community archive of live music performances in Ethiopia — API."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: calling Depends()/Query() in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates long, single-statement DDL lines.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []
